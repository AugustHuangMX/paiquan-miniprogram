<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>底部标签图标</title>
<style>
  body{margin:0;background:#1a1d23;color:#c9ced8;font-family:system-ui,"Microsoft YaHei",sans-serif;padding:26px}
  h2{font-size:14px;font-weight:600;margin:0 0 14px;color:#8f97a5}
  .row{display:flex;gap:34px;margin-bottom:24px;flex-wrap:wrap}
  .item{text-align:center}
  .item .lab{font-size:11px;color:#6f7787;margin-top:6px}
  /* 模拟微信底栏实际显示大小（逻辑像素约 27px） */
  .bar{display:flex;gap:0;background:#101318;border:1px solid #262c36;border-radius:10px;overflow:hidden;width:290px;margin-bottom:22px}
  .tab{flex:1;padding:8px 0 6px;text-align:center;font-size:10px;color:#8f97a5}
  .tab.on{color:#e0353a}
  .tab img{width:27px;height:27px;display:block;margin:0 auto 2px}
  button{background:#e0353a;color:#fff;border:0;border-radius:9px;padding:10px 18px;font-size:13px;cursor:pointer;font-weight:600}
  pre{background:#12151a;border:1px solid #262c36;border-radius:9px;padding:12px;font-size:12px;color:#9aa3b2;white-space:pre-wrap}
</style>
</head>
<body>

<h2>微信底栏实际效果预览（左：未选中　右：选中）</h2>
<div class="bar" id="bar">
  <div class="tab on"><img id="p1"><div>地图</div></div>
  <div class="tab"><img id="p2"><div>猎杀榜</div></div>
  <div class="tab"><img id="p3"><div>战绩</div></div>
</div>

<h2>81×81 原始尺寸</h2>
<div class="row">
  <div class="item"><img id="s1" width="81" height="81"><div class="lab">tab-maps</div></div>
  <div class="item"><img id="s1b" width="81" height="81"><div class="lab">tab-maps-on</div></div>
  <div class="item"><img id="s2" width="81" height="81"><div class="lab">tab-predator</div></div>
  <div class="item"><img id="s2b" width="81" height="81"><div class="lab">tab-predator-on</div></div>
  <div class="item"><img id="s3" width="81" height="81"><div class="lab">tab-stats</div></div>
  <div class="item"><img id="s3b" width="81" height="81"><div class="lab">tab-stats-on</div></div>
</div>

<button id="btn">导出 6 张 PNG 到 assets 目录</button>
<pre id="log">等待导出…</pre>

<!-- ================= 图标本体 ================= -->
<script>
const OFF = "#8f97a5";   // 未选中：和底栏文字同色
const ON  = "#e0353a";   // 选中：主题红

// 地图：定位图钉
const MAPS = c => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 81 81" width="81" height="81">
  <path fill="${c}" fill-rule="evenodd" d="M40.5 7C27.5 7 17 17.5 17 30.5 17 47.6 40.5 74 40.5 74S64 47.6 64 30.5C64 17.5 53.5 7 40.5 7zm0 15.5a8.2 8.2 0 110 16.4 8.2 8.2 0 010-16.4z"/>
</svg>`;

// 猎杀榜：奖杯
const PREDATOR = c => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 81 81" width="81" height="81">
  <path fill="${c}" d="M24 9h33v14.5c0 9.1-7.4 16.5-16.5 16.5S24 32.6 24 23.5V9z"/>
  <rect fill="${c}" x="37" y="39.5" width="7" height="11"/>
  <rect fill="${c}" x="25" y="50.5" width="31" height="7.5" rx="2.5"/>
  <path fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" d="M24 14.5h-7.5v3.2A9.3 9.3 0 0 0 25.8 27"/>
  <path fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" d="M57 14.5h7.5v3.2A9.3 9.3 0 0 1 55.2 27"/>
</svg>`;

// 战绩：柱状图
const STATS = c => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 81 81" width="81" height="81">
  <rect fill="${c}" x="14" y="46" width="13" height="24" rx="3"/>
  <rect fill="${c}" x="34" y="31" width="13" height="39" rx="3"/>
  <rect fill="${c}" x="54" y="16" width="13" height="54" rx="3"/>
</svg>`;

const SET = [
  { name: "tab-maps",     svg: MAPS },
  { name: "tab-predator", svg: PREDATOR },
  { name: "tab-stats",    svg: STATS },
];

function render(svgStr, size) {
  return new Promise((resolve, reject) => {
    const blob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/png"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("渲染失败")); };
    img.src = url;
  });
}

(async function preview() {
  const off = [], on = [];
  for (const s of SET) {
    off.push(await render(s.svg(OFF), 81));
    on.push(await render(s.svg(ON), 81));
  }
  // 底栏预览
  const ids = [["p1", 0], ["p2", 1], ["p3", 2]];
  for (const [id, i] of ids) document.getElementById(id).src = on[i];
  document.getElementById("p2").src = off[1];
  document.getElementById("p3").src = off[2];
  document.getElementById("bar").querySelectorAll(".tab")[0].classList.add("on");

  const solo = {
    s1: off[0], s1b: on[0],
    s2: off[1], s2b: on[1],
    s3: off[2], s3b: on[2],
  };
  for (const id of Object.keys(solo)) document.getElementById(id).src = solo[id];

  window.__rendered = { off, on };
  document.getElementById("log").textContent = "预览已生成。点上面的按钮导出。";
})();

document.getElementById("btn").addEventListener("click", async () => {
  const log = document.getElementById("log");
  log.textContent = "";
  const { off, on } = window.__rendered;
  for (let i = 0; i < SET.length; i++) {
    for (const [dataURL, suffix] of [[off[i], ""], [on[i], "-on"]]) {
      const name = SET[i].name + suffix + ".png";
      const r = await fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, dataURL }),
      });
      const j = await r.json();
      log.textContent += (j.ok ? "✓ " : "✗ ") + name +
        (j.ok ? "  " + j.bytes + " 字节" : "  失败：" + (j.error || "未知原因")) + "\n";
    }
  }
});
</script>
</body>
</html>
